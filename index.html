<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LexiTrek</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          180deg,
          #dff7e5 0%,
          #f7fff9 45%,
          #e6f3ff 100%
        );

      min-height: 100vh;
      color: #17352a;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .brand {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .version {
      background: white;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .logo-circle {
      width: 105px;
      height: 105px;
      margin: 0 auto 22px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 3.2rem;

      background: white;

      box-shadow:
        0 12px 30px rgba(22, 90, 60, 0.16);
    }

    h1 {
      font-size: 2.8rem;
      line-height: 1;
      margin-bottom: 10px;
      color: #12613e;
    }

    .tagline {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .description {
      max-width: 330px;
      margin: 0 auto 30px;
      line-height: 1.55;
      color: #52675f;
    }

    .feature-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 34px;
    }

    .feature {
      background: rgba(255,255,255,0.85);
      border-radius: 18px;
      padding: 15px 8px;

      box-shadow:
        0 6px 18px rgba(0,0,0,0.06);
    }

    .feature-icon {
      font-size: 1.7rem;
      margin-bottom: 7px;
    }

    .feature-title {
      font-size: 0.78rem;
      font-weight: 700;
    }

    .start-button {
      width: 100%;
      border: none;
      padding: 18px 22px;

      border-radius: 18px;

      background: #137548;
      color: white;

      font-size: 1.05rem;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 10px 22px rgba(19,117,72,0.24);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .start-button:active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 18px;
      min-height: 24px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #12613e;
    }

    footer {
      text-align: center;
      font-size: 0.72rem;
      color: #71837c;
      padding-top: 25px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="top-bar">

      <div class="brand">
        LEXITREK
      </div>

      <div class="version">
        Prototype 0.1
      </div>

    </div>


    <section class="hero">

      <div class="logo-circle">
        🗺️
      </div>

      <h1>
        LexiTrek
      </h1>

      <p class="tagline">
        Vocabulary Adventure
      </p>

      <p class="description">
        Learn new English words,
        conquer challenges and journey
        across the LexiTrek board.
      </p>


      <div class="feature-row">

        <div class="feature">

          <div class="feature-icon">
            🎲
          </div>

          <div class="feature-title">
            Play
          </div>

        </div>


        <div class="feature">

          <div class="feature-icon">
            🧠
          </div>

          <div class="feature-title">
            Learn
          </div>

        </div>


        <div class="feature">

          <div class="feature-icon">
            🏆
          </div>

          <div class="feature-title">
            Master
          </div>

        </div>

      </div>


      <button
        class="start-button"
        id="startButton"
      >
        START ADVENTURE
      </button>


      <div
        class="status"
        id="statusMessage"
      ></div>

    </section>


    <footer>
      Designed for Form One English Vocabulary Learning
    </footer>

  </main>


  <script>

    const startButton =
      document.getElementById("startButton");

    const statusMessage =
      document.getElementById("statusMessage");


    startButton.addEventListener(
      "click",
      function () {

        statusMessage.textContent =
          "LexiTrek is ready for your adventure!";

      }
    );

  </script>

</body>

</html>
